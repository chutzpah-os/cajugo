# Postgres local para desenvolvimento e testes (mesma versão major do Supabase).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cajugo
      POSTGRES_PASSWORD: cajugo
      POSTGRES_DB: cajugo
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
